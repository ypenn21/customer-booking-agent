[project]
name = "orchestrator"
version = "0.1.0"
description = "Main orchestrator agent for delegation"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform[evaluation,agent-engines]>=2.6.0",
    "google-adk[a2a,agent-identity,mcp]>=2.12.0",
    "google-cloud-iamconnectorcredentials>=0.1.2",
    "a2a-sdk~=0.3.26",
    "google-auth>=2.62.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-httpx",
    "gcsfs>=2026.10.1",
    "google-cloud-logging>=3.17.0,<4.0.0",
    "protobuf>=7.36.2",
    "starlette>=0.37.0",
    "PyJWT>=2.15.1",
    "cloudpickle==3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
