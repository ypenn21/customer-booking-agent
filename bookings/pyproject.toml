[project]
name = "bookings"
version = "0.1.0"
description = "Specialized agent for custom bookings and reservations"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform[agent_engines]>=2.6.0",
    "google-adk[a2a]>=2.12.0",
    "a2a-sdk~=0.3.26",
    "google-auth>=2.62.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-httpx",
    "gcsfs>=2026.10.1",
    "google-cloud-logging>=3.17.0,<4.0.0",
    "protobuf>=7.36.2",
    "google-cloud-secret-manager>=2.31.0,<3.0.0",
    "cloudpickle==3.1.2",
    "PyJWT>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
