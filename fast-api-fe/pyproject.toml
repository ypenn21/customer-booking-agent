[project]
name = "fast-api-fe"
version = "0.1.0"
description = "Chat UI and Agent Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "google-adk[a2a,agent-identity,mcp]>=2.12.0",
    "google-cloud-iamconnectorcredentials>=0.1.2",
    "a2a-sdk~=0.3.26",
    "google-cloud-aiplatform[agent-engines]>=2.6.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "PyJWT>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
